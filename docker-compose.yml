# =============================================================================
# LUMI — Docker Compose Stack (DigitalOcean Droplet)
# =============================================================================
# Services:
#   - backend: FastAPI (uvicorn on :8080)
#   - nginx:   Static SPA + reverse proxy (:80)
#
# External dependencies (kept out of this stack):
#   - Supabase     → PostgreSQL + Auth
#   - Upstash      → Redis cache
# =============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    container_name: lumi-backend
    env_file: .env
    environment:
      # Force production CORS if not set in .env
      - PYTHONUNBUFFERED=1
    networks:
      - lumi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: lumi-nginx
    ports:
      - "80:80"
      # - "443:443"   # Uncomment after SSL is set up
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./react-frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lumi-net
    restart: unless-stopped

networks:
  lumi-net:
    driver: bridge
