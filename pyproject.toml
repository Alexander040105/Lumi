[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-backend"
version = "0.1.0"
dependencies = [
    "fastapi==0.115.0",
    "pydantic-settings==2.4.0",
    "python-dotenv==1.0.1",
    "supabase==2.10.0",
    "python-jose[cryptography]==3.3.0",
    "httpx==0.27.2",
    "redis==5.0.8",
    "google-genai==0.6.0",
    "groq==0.18.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]

[tool.vercel]
entrypoint = "api.index:app"
