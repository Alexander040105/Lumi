# =============================================================================
# LUMI Nginx — Production Configuration
# =============================================================================
# Serves the built Vite React SPA and reverse-proxies /api/* to the backend.
# Designed for a single DigitalOcean Droplet running docker-compose.
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml;

    # Rate-limiting zone (optional — tune as needed)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    # -----------------------------------------------------------------------
    # Upstream: FastAPI backend
    # -----------------------------------------------------------------------
    upstream backend {
        server backend:8080;
    }

    # -----------------------------------------------------------------------
    # Server block — HTTP (port 80)
    # -----------------------------------------------------------------------
    # When you get a domain + SSL, duplicate this block for port 443 with
    # SSL certificates and redirect HTTP -> HTTPS.
    # -----------------------------------------------------------------------
    server {
        listen 80;
        server_name _;          # Catch-all until you set a real domain
        root /usr/share/nginx/html;
        index index.html;

        # Health check for uptime monitors / load balancers
        location /health/ {
            proxy_pass http://backend/api/v1/health/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # API proxy — everything under /api/ goes to FastAPI
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Optional rate limiting
            # limit_req zone=api burst=20 nodelay;
        }

        # Static assets — long cache for hashed Vite chunks
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|json)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA fallback — any unknown path returns index.html so React Router works
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
